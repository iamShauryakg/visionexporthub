# Nginx Configuration Template for Single Page Application (React + Vite)
# Save this file to /etc/nginx/sites-available/visionexport or equivalent and symlink to sites-enabled.

server {
    listen 80;
    listen [::]:80;
    
    server_name visionexporthub.com www.visionexporthub.com;
    root /var/www/visionexport/dist;
    index index.html;

    # Gzip Compression for Fast Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Fallback to index.html for Client-side Routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Static Asset Caching for Images, CSS, & JavaScript
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Error Pages Fallback
    error_page 404 /index.html;
}
